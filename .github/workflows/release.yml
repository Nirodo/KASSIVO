name: release

# Bei jedem Versions-Tag vX.Y.Z: testen, dann das Update-Paket bauen und ans Release hängen.
# Design: docs/superpowers/specs/2026-11-27-update-design.md (R1)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  package:
    name: Update-Paket bauen und hochladen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag und Version prüfen
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Ungültiges Tag"; exit 1; }
          VERSION="${TAG#v}"
          grep -qx "version = \"${VERSION}\"" pyproject.toml || { echo "pyproject.toml passt nicht"; exit 1; }
          grep -qx "__version__ = \"${VERSION}\"" src/kassivo/__init__.py || { echo "__version__ passt nicht"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Archiv, Wheel und Prüfsummen bauen
        run: |
          set -euo pipefail
          mkdir dist
          git archive --format=zip --prefix="kassivo-${VERSION}/" -o "dist/kassivo-${VERSION}.zip" HEAD
          python -m pip wheel --no-deps -w dist .
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Ans Release hängen (nichts überschreiben)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*
          else
            NOTES="docs/releases/${TAG}.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" dist/* --verify-tag --title "KASSIVO ${VERSION}" --notes-file "$NOTES"
            else
              gh release create "$TAG" dist/* --verify-tag --title "KASSIVO ${VERSION}" --notes ""
            fi
          fi
